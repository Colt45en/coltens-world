<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Engine Recorder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar Styles */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.3); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        body { margin: 0; overflow: hidden; }

        /* NEXUS Editor Styles */
        .nexus-pill {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nexus-pill-lime {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .nexus-pill-neon {
            background: rgba(6, 182, 212, 0.1);
            color: #06b6d4;
            border: 1px solid rgba(6, 182, 212, 0.2);
            animation: pulse 1s infinite;
        }
        .nexus-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: #06b6d4;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .nexus-btn:hover {
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.4);
        }
        .nexus-editor-content {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100">

    <div id="root"></div>

    <!-- NEXUS Full-Screen Editor Overlay -->
    <div id="nexus-editor-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex flex-col">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 bg-slate-900/80 border-b border-cyan-500/20">
            <div class="flex items-center gap-4">
                <input
                    id="nexus-title-input"
                    type="text"
                    placeholder="Note title..."
                    class="bg-transparent text-white placeholder-slate-400 outline-none text-lg font-medium"
                />
                <div id="nexus-save-badge" class="nexus-pill nexus-pill-lime">Saved ✓</div>
            </div>
            <div class="flex items-center gap-2">
                <span id="nexus-wordcount" class="text-xs text-slate-400">0 words</span>
                <span id="nexus-charcount" class="text-xs text-slate-400">0 chars</span>
                <span id="nexus-linecount" class="text-xs text-slate-400">1 line</span>
                <button type="button" title="Close editor" onclick="closeNexusEditor()" class="text-slate-400 hover:text-white transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="flex items-center gap-2 p-3 bg-slate-900/60 border-b border-cyan-500/10">
            <button onclick="nexusCmd('bold')" class="nexus-btn" title="Bold (Ctrl+B)">B</button>
            <button onclick="nexusCmd('italic')" class="nexus-btn" title="Italic (Ctrl+I)">I</button>
            <button onclick="nexusCmd('underline')" class="nexus-btn" title="Underline (Ctrl+U)">U</button>
            <div class="w-px h-6 bg-slate-600"></div>
            <button onclick="nexusBlock('h1')" class="nexus-btn" title="Heading 1">H1</button>
            <button onclick="nexusBlock('h2')" class="nexus-btn" title="Heading 2">H2</button>
            <button onclick="nexusBlock('h3')" class="nexus-btn" title="Heading 3">H3</button>
            <div class="w-px h-6 bg-slate-600"></div>
            <button onclick="nexusList()" class="nexus-btn" title="Bullet List">•</button>
            <button onclick="nexusQuote()" class="nexus-btn" title="Quote">"</button>
            <button onclick="nexusCode()" class="nexus-btn" title="Code">&lt;/&gt;</button>
            <div class="w-px h-6 bg-slate-600"></div>
            <button onclick="nexusInsertDate()" class="nexus-btn" title="Insert Date">📅</button>
            <button onclick="nexusNewNote()" class="nexus-btn" title="New Note">✨</button>
        </div>

        <!-- Editor -->
        <div class="flex-1 overflow-hidden">
            <div
                id="nexus-editor"
                contenteditable="true"
                class="w-full h-full p-6 text-white bg-transparent outline-none overflow-auto custom-scrollbar nexus-editor-content"
            ></div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==================== WebSocket Configuration ====================
        const ENVELOPE_VERSION = "1.0";
        const WS_URL = "ws://127.0.0.1:3000/ws/chat";

        function uid(prefix = "id") {
            return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function nowIso() {
            return new Date().toISOString();
        }

        // ==================== Icons (Inline SVGs) ====================
        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Mic = (props) => <IconBase {...props}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></IconBase>;
        const Camera = (props) => <IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const Monitor = (props) => <IconBase {...props}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></IconBase>;
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Pause = (props) => <IconBase {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></IconBase>;
        const Square = (props) => <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const Send = (props) => <IconBase {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconBase>;
        const Bot = (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><polyline points="6 9 12 15 18 9"/></IconBase>;
        const Eye = (props) => <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const EyeOff = (props) => <IconBase {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
        const Activity = (props) => <IconBase {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconBase>;
        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>;
        const Cpu = (props) => <IconBase {...props}><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></IconBase>;

        // ==================== Components ====================
        const GlassCard = ({ children, className = "", intensity = "md" }) => {
            const blurClass = intensity === "lg" ? "backdrop-blur-xl" : "backdrop-blur-md";
            return (
                <div className={`bg-slate-900/40 ${blurClass} border border-cyan-500/20 rounded-2xl shadow-[0_0_15px_rgba(6,182,212,0.1)] ${className}`}>
                    {children}
                </div>
            );
        };

        const NeonButton = ({ children, onClick, active, variant = "primary", disabled, className = "" }) => {
            const variants = {
                primary: active ? 'bg-cyan-500 text-black shadow-[0_0_20px_rgba(6,182,212,0.5)]' : 'bg-slate-800/50 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/10',
                danger: 'bg-red-500/20 text-red-400 border border-red-500/40 hover:bg-red-500/40',
                ghost: 'text-slate-400 hover:text-cyan-400 hover:bg-white/5'
            };

            return (
                <button
                    disabled={disabled}
                    onClick={onClick}
                    className={`px-4 py-2 rounded-xl font-medium transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed ${variants[variant]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        // ==================== Main App ====================
        function App() {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: "Systems initialized. I am your Fusion Engine Agent. Ready to coordinate recording protocols or adjust world parameters. What are your orders?" }
            ]);
            const [inputValue, setInputValue] = useState("");
            const [status, setStatus] = useState("idle");
            const [mode, setMode] = useState("screen");
            const [timer, setTimer] = useState("00:00");
            const [showAdvanced, setShowAdvanced] = useState(false);
            const [recordings, setRecordings] = useState([]);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [wsConnected, setWsConnected] = useState(false);
            const [convoId] = useState(uid("conv"));

            const [settings, setSettings] = useState({
                bitrate: 2500,
                width: 1920,
                height: 1080,
                fps: 30,
                mixMic: false
            });

            const wsRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const streamRef = useRef(null);
            const chunksRef = useRef([]);
            const timerRef = useRef(null);
            const startTimeRef = useRef(0);
            const videoPreviewRef = useRef(null);
            const chatEndRef = useRef(null);
            const recordingLockRef = useRef({ locked: false, owner: null });

            // ==================== Recording Lock (Mutex) ====================
            const recordingLock = {
                claim(kind) {
                    if (recordingLockRef.current.locked) {
                        return { ok: false, reason: `Already recording: ${recordingLockRef.current.owner}`, token: null };
                    }
                    recordingLockRef.current.locked = true;
                    recordingLockRef.current.owner = kind;
                    return { ok: true, reason: null, token: `tok-${Date.now()}` };
                },
                release() {
                    if (recordingLockRef.current.locked) {
                        recordingLockRef.current.locked = false;
                        recordingLockRef.current.owner = null;
                        return true;
                    }
                    return false;
                }
            };

            // ==================== WebSocket Setup ====================
            useEffect(() => {
                const ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    setWsConnected(true);
                    setMessages(prev => [...prev, { role: 'system', content: "✅ Neural link established with Nucleus." }]);
                };

                ws.onmessage = (ev) => {
                    try {
                        const msg = JSON.parse(ev.data);
                        if (msg.v === ENVELOPE_VERSION && msg.kind) {
                            handleIncomingMessage(msg);
                        }
                    } catch (e) {
                        console.error("Message parse error:", e, ev.data);
                    }
                };

                ws.onerror = () => {
                    setWsConnected(false);
                    console.error("WS error (no details from browser)");
                };

                ws.onclose = (ev) => {
                    setWsConnected(false);
                    const detail = `code=${ev.code} reason="${ev.reason || "(none)"}" clean=${ev.wasClean}`;
                    setMessages(prev => [...prev, { role: 'system', content: `❌ Disconnected: ${detail}`, isError: true }]);
                    setTimeout(() => window.location.reload(), 3000);
                };

                wsRef.current = ws;

                return () => ws.close();
            }, []);

            const handleIncomingMessage = (msg) => {
                const { kind, payload } = msg;

                if (kind === "chat.start") {
                    setMessages(prev => [...prev, { role: 'assistant', content: "" }]);
                } else if (kind === "chat.delta") {
                    setMessages(prev => {
                        const updated = [...prev];
                        const lastMsg = updated[updated.length - 1];
                        if (lastMsg?.role === 'assistant') {
                            lastMsg.content += payload.delta || "";
                        }
                        return updated;
                    });
                } else if (kind === "chat.response") {
                    const resp = payload;
                    if (resp?.evidence) {
                        setMessages(prev => [...prev, { role: 'evidence', evidence: resp.evidence }]);
                    }
                    // Tool execution now handled by Python server
                }
            };

            const wsSend = (kind, payload) => {
                if (!wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) {
                    console.warn("WS not connected");
                    return;
                }
                const msg = {
                    v: ENVELOPE_VERSION,
                    id: uid("env"),
                    ts: nowIso(),
                    traceId: convoId,
                    source: "fusion-engine",
                    kind,
                    payload
                };
                wsRef.current.send(JSON.stringify(msg));
            };

            // ==================== Tool Runtime ====================
            const toolRuntime = {
                async recordAudio(convoId, args) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = (e) => chunks.push(e.data);
                        recorder.start();

                        setMessages(prev => [...prev, { role: 'system', content: `Recording audio for ${(args.durationMs || 5000) / 1000}s...` }]);
                        setStatus("recording");

                        const timeout = setTimeout(() => {
                            recorder.stop();
                        }, args.durationMs || 5000);

                        recorder.onstop = () => {
                            clearTimeout(timeout);
                            const blob = new Blob(chunks, { type: "audio/webm" });
                            const url = URL.createObjectURL(blob);
                            wsSend("tool.result", {
                                convoId,
                                toolName: "record_audio",
                                ok: true,
                                result: { audioUrl: url, duration: args.durationMs, size: blob.size },
                                error: null
                            });
                            stream.getTracks().forEach(t => t.stop());
                            recordingLock.release();
                            setStatus("idle");
                        };
                    } catch (e) {
                        console.error("Audio error:", e);
                        wsSend("tool.result", {
                            convoId,
                            toolName: "record_audio",
                            ok: false,
                            result: {},
                            error: e.message
                        });
                        recordingLock.release();
                    }
                },

                async recordScreen(convoId, args) {
                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({
                            video: { cursor: "always" },
                            audio: args.systemAudio ? true : false
                        });
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = (e) => chunks.push(e.data);
                        recorder.start();

                        setMessages(prev => [...prev, { role: 'system', content: `Recording screen for ${(args.durationMs || 10000) / 1000}s...` }]);
                        setStatus("recording");

                        const timeout = setTimeout(() => {
                            recorder.stop();
                        }, args.durationMs || 10000);

                        recorder.onstop = () => {
                            clearTimeout(timeout);
                            const blob = new Blob(chunks, { type: "video/webm" });
                            const url = URL.createObjectURL(blob);
                            wsSend("tool.result", {
                                convoId,
                                toolName: "record_screen",
                                ok: true,
                                result: { videoUrl: url, duration: args.durationMs, size: blob.size },
                                error: null
                            });
                            stream.getTracks().forEach(t => t.stop());
                            recordingLock.release();
                            setStatus("idle");
                        };
                    } catch (e) {
                        console.error("Screen error:", e);
                        wsSend("tool.result", {
                            convoId,
                            toolName: "record_screen",
                            ok: false,
                            result: {},
                            error: e.message
                        });
                        recordingLock.release();
                    }
                },

                async execute(toolCall, convoId) {
                    const lock = recordingLock.claim(toolCall.name);
                    if (!lock.ok) {
                        setMessages(prev => [...prev, { role: 'system', content: `⚠️ ${lock.reason}`, isError: true }]);
                        return;
                    }

                    if (toolCall.name === "record_audio") {
                        this.recordAudio(convoId, toolCall.args);
                    } else if (toolCall.name === "record_screen") {
                        this.recordScreen(convoId, toolCall.args);
                    } else {
                        recordingLock.release();
                        setMessages(prev => [...prev, { role: 'system', content: `Unknown tool: ${toolCall.name}`, isError: true }]);
                    }
                }
            };

            // ==================== Recording Logic ====================
            const startRecording = async () => {
                try {
                    chunksRef.current = [];
                    const constraints = {
                        video: mode !== 'audio' ? {
                            width: settings.width,
                            height: settings.height,
                            frameRate: settings.fps
                        } : false,
                        audio: true
                    };

                    let stream;
                    if (mode === 'screen') {
                        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        if (settings.mixMic) {
                            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            const audioCtx = new AudioContext();
                            const dest = audioCtx.createMediaStreamDestination();
                            if (stream.getAudioTracks().length > 0) {
                                audioCtx.createMediaStreamSource(new MediaStream([stream.getAudioTracks()[0]])).connect(dest);
                            }
                            audioCtx.createMediaStreamSource(micStream).connect(dest);
                            stream = new MediaStream([stream.getVideoTracks()[0], dest.stream.getAudioTracks()[0]]);
                        }
                    } else {
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                    }

                    streamRef.current = stream;
                    if (videoPreviewRef.current) videoPreviewRef.current.srcObject = stream;

                    const recorder = new MediaRecorder(stream, {
                        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm',
                        videoBitsPerSecond: settings.bitrate * 1000
                    });

                    recorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunksRef.current.push(e.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        setRecordings(prev => [{
                            id: Date.now(),
                            url,
                            timestamp: new Date().toLocaleTimeString(),
                            mode
                        }, ...prev]);

                        if (videoPreviewRef.current) videoPreviewRef.current.srcObject = null;
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorderRef.current = recorder;
                    recorder.start(1000);

                    startTimeRef.current = Date.now();
                    setStatus("recording");
                    startTimer();
                    setMessages(prev => [...prev, { role: 'system', content: "Recording sequence initiated." }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'system', content: `System Error: ${err.message}`, isError: true }]);
                }
            };

            const pauseRecording = () => {
                if (mediaRecorderRef.current?.state === 'recording') {
                    mediaRecorderRef.current.pause();
                    clearInterval(timerRef.current);
                    setStatus("paused");
                    setMessages(prev => [...prev, { role: 'system', content: "Process suspended." }]);
                } else if (mediaRecorderRef.current?.state === 'paused') {
                    mediaRecorderRef.current.resume();
                    startTimer();
                    setStatus("recording");
                    setMessages(prev => [...prev, { role: 'system', content: "Process resumed." }]);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current) {
                    mediaRecorderRef.current.stop();
                    clearInterval(timerRef.current);
                    setTimer("00:00");
                    setStatus("idle");
                    startTimeRef.current = 0;
                    setMessages(prev => [...prev, { role: 'system', content: "Data stream captured and archived." }]);
                }
            };

            const startTimer = () => {
                timerRef.current = setInterval(() => {
                    const diff = Date.now() - startTimeRef.current;
                    const m = Math.floor(diff / 60000).toString().padStart(2, '0');
                    const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    setTimer(`${m}:${s}`);
                }, 1000);
            };

            // ==================== Chat Handling ====================
            const handleSendMessage = () => {
                if (!inputValue.trim()) return;

                const userMsg = inputValue.trim();
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setInputValue("");

                if (!wsConnected) {
                    setMessages(prev => [...prev, { role: 'system', content: "Connection not established.", isError: true }]);
                    return;
                }

                wsSend("chat.request", {
                    convoId,
                    userId: "fusion-user",
                    persona: "General",
                    text: userMsg
                });
            };

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const handleMouseMove = (e) => {
                setMousePos({ x: e.clientX, y: e.clientY });
            };

            // ==================== Render ====================
            return (
                <div
                    className="min-h-screen bg-[#020617] text-slate-100 flex flex-col md:flex-row font-sans selection:bg-cyan-500/30 overflow-hidden"
                    onMouseMove={handleMouseMove}
                >
                    <div className="fixed inset-0 pointer-events-none z-0">
                        <div
                            className="absolute w-[600px] h-[600px] bg-cyan-600/10 rounded-full blur-[120px] transition-transform duration-300 ease-out"
                            style={{ transform: `translate(${mousePos.x - 300}px, ${mousePos.y - 300}px)` }}
                        />
                        <div className="absolute top-0 left-0 w-full h-full opacity-20 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:32px_32px]" />
                    </div>

                    {/* Sidebar */}
                    <aside className="w-full md:w-96 flex flex-col border-r border-cyan-500/10 z-10 bg-black/20 backdrop-blur-md">
                        <div className="p-6 border-b border-cyan-500/10 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center">
                                    <Bot className="text-cyan-400" size={20} />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg tracking-tight">FUSION <span className="text-cyan-500 text-xs align-top ml-1">v2.5</span></h1>
                                    <div className="flex items-center gap-1.5">
                                        <span className={`w-2 h-2 rounded-full ${wsConnected ? 'bg-cyan-500 animate-pulse' : 'bg-red-500'}`} />
                                        <span className="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">{wsConnected ? 'Connected' : 'Offline'}</span>
                                    </div>
                                </div>
                            </div>
                            <NeonButton onClick={() => window.openNexusEditor?.()} variant="ghost" className="text-xs px-3 py-1">
                                NEXUS
                            </NeonButton>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {msg.role === 'evidence' ? (
                                        <div className="max-w-[85%] p-3 rounded-2xl bg-slate-800/60 border border-cyan-500/20 text-xs space-y-2">
                                            {msg.evidence?.grounding?.length > 0 && (
                                                <div>
                                                    <div className="font-bold text-cyan-400 mb-1">Grounding:</div>
                                                    {msg.evidence.grounding.map((g, j) => (
                                                        <div key={j} className="text-slate-300">
                                                            {g.token} → {g.lexId} ({(g.confidence * 100).toFixed(0)}%)
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {msg.evidence?.actions?.length > 0 && (
                                                <div>
                                                    <div className="font-bold text-cyan-400 mb-1">Actions:</div>
                                                    {msg.evidence.actions.map((a, j) => (
                                                        <div key={j} className="text-slate-300">
                                                            {a.name}: {a.argsPreview}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className={`
                                            max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed
                                            ${msg.role === 'user'
                                                ? 'bg-cyan-500 text-black font-medium rounded-tr-none'
                                                : msg.isError
                                                    ? 'bg-red-500/10 border border-red-500/30 text-red-200 rounded-tl-none'
                                                    : msg.role === 'system'
                                                        ? 'bg-slate-800/40 italic text-cyan-200/70 text-xs border border-white/5'
                                                        : 'bg-slate-800/80 border border-white/5 text-slate-200 rounded-tl-none'
                                            }
                                        `}>
                                            {msg.content}
                                        </div>
                                    )}
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Input */}
                        <div className="p-4 bg-black/40 border-t border-cyan-500/10">
                            <div className="relative group">
                                <textarea
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            handleSendMessage();
                                        }
                                    }}
                                    placeholder="Enter engine command..."
                                    disabled={!wsConnected}
                                    className="w-full bg-slate-900/60 border border-cyan-500/20 rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/30 transition-all resize-none min-h-[50px] max-h-[150px] disabled:opacity-50"
                                    rows={1}
                                />
                                <button
                                    onClick={handleSendMessage}
                                    disabled={!wsConnected}
                                    className="absolute right-3 bottom-3 text-cyan-500 hover:text-cyan-400 transition-colors p-1 disabled:opacity-50"
                                >
                                    <Send size={18} />
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 h-screen overflow-y-auto p-6 lg:p-10 relative z-10 custom-scrollbar">
                        <div className="max-w-6xl mx-auto space-y-8">

                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                                <div>
                                    <h2 className="text-4xl font-black tracking-tight flex items-center gap-3">
                                        SYSTEM <span className="text-cyan-500">CORE</span>
                                    </h2>
                                    <p className="text-slate-500 font-medium">World Engine Integrated Recording Interface</p>
                                </div>

                                <GlassCard className="flex items-center gap-6 px-6 py-3">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Status</span>
                                        <div className="flex items-center gap-2">
                                            <div className={`w-2 h-2 rounded-full ${status === 'recording' ? 'bg-red-500 animate-pulse' : status === 'paused' ? 'bg-yellow-500' : 'bg-slate-600'}`} />
                                            <span className="text-sm font-mono font-bold uppercase">{status}</span>
                                        </div>
                                    </div>
                                    <div className="w-px h-8 bg-white/10" />
                                    <div className="flex flex-col min-w-[60px]">
                                        <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Uptime</span>
                                        <span className={`text-sm font-mono font-bold ${status === 'recording' ? 'text-red-400' : 'text-slate-300'}`}>{timer}</span>
                                    </div>
                                </GlassCard>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                {/* Control Panel */}
                                <div className="lg:col-span-4 space-y-6">
                                    <GlassCard className="p-6 space-y-6" intensity="lg">
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-[0.2em] flex items-center gap-2">
                                                <Cpu size={14} className="text-cyan-500" /> Mode Select
                                            </h3>
                                            <div className="grid grid-cols-1 gap-2">
                                                <NeonButton active={mode === 'screen'} onClick={() => setMode('screen')}>
                                                    <Monitor size={18} /> Display Stream
                                                </NeonButton>
                                                <NeonButton active={mode === 'camera'} onClick={() => setMode('camera')}>
                                                    <Camera size={18} /> Optic Link
                                                </NeonButton>
                                                <NeonButton active={mode === 'audio'} onClick={() => setMode('audio')}>
                                                    <Mic size={18} /> Sonic Capture
                                                </NeonButton>
                                            </div>
                                        </div>

                                        <div className="pt-4 space-y-3">
                                            <NeonButton
                                                className="w-full py-4 text-lg"
                                                variant={status === 'idle' ? 'primary' : 'danger'}
                                                onClick={status === 'idle' ? startRecording : stopRecording}
                                            >
                                                {status === 'idle' ? <><Play fill="currentColor" size={20} /> Initiate Capture</> : <><Square fill="currentColor" size={20} /> Terminate</>}
                                            </NeonButton>

                                            {status !== 'idle' && (
                                                <NeonButton className="w-full" variant="ghost" onClick={pauseRecording}>
                                                    {status === 'paused' ? <><Play size={16} /> Resume Process</> : <><Pause size={16} /> Suspend Process</>}
                                                </NeonButton>
                                            )}
                                        </div>
                                    </GlassCard>

                                    <GlassCard className="p-6">
                                        <button
                                            onClick={() => setShowAdvanced(!showAdvanced)}
                                            className="flex items-center justify-between w-full text-xs font-bold text-slate-500 uppercase tracking-widest"
                                        >
                                            Neural Constraints
                                            <ChevronDown className={`transition-transform ${showAdvanced ? 'rotate-180' : ''}`} size={16} />
                                        </button>
                                        {showAdvanced && (
                                            <div className="mt-6 grid grid-cols-2 gap-4 animate-in fade-in">
                                                {Object.entries({
                                                    fps: 'Framerate',
                                                    width: 'Width',
                                                    height: 'Height',
                                                    bitrate: 'Bitrate'
                                                }).map(([key, label]) => (
                                                    <div key={key} className="space-y-1">
                                                        <label className="text-[9px] text-slate-500 font-black uppercase">{label}</label>
                                                        <input
                                                            type="number"
                                                            value={settings[key]}
                                                            onChange={e => setSettings(s => ({...s, [key]: parseInt(e.target.value)}))}
                                                            className="w-full bg-slate-900/50 border border-white/10 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-cyan-500/40 outline-none"
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </GlassCard>
                                </div>

                                {/* Preview */}
                                <div className="lg:col-span-8 space-y-6">
                                    <div className="relative group rounded-3xl overflow-hidden border border-cyan-500/20 aspect-video bg-black shadow-2xl">
                                        <video
                                            ref={videoPreviewRef}
                                            autoPlay
                                            muted
                                            playsInline
                                            className="w-full h-full object-cover"
                                        />

                                        {status === 'idle' && (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/60">
                                                <div className="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mb-4">
                                                    <EyeOff className="text-slate-500" size={32} />
                                                </div>
                                                <p className="text-slate-400 font-medium">Visual Link Offline</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-4">
                                        <h3 className="text-lg font-bold flex items-center gap-2">
                                            <div className="w-1.5 h-6 bg-cyan-500 rounded-full" /> Archives
                                        </h3>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {recordings.length === 0 ? (
                                                <div className="col-span-full py-8 flex flex-col items-center justify-center opacity-30">
                                                    <Trash2 size={32} className="mb-2" />
                                                    <p className="text-sm">No recordings yet.</p>
                                                </div>
                                            ) : (
                                                recordings.map(rec => (
                                                    <GlassCard key={rec.id} className="p-3 group">
                                                        <video src={rec.url} controls className="w-full aspect-video rounded-xl bg-black" />
                                                        <div className="p-3 flex items-center justify-between">
                                                            <div>
                                                                <p className="text-[10px] text-slate-500 font-bold uppercase">{rec.timestamp}</p>
                                                                <p className="text-xs font-mono text-cyan-400">{rec.mode.toUpperCase()}</p>
                                                            </div>
                                                            <a
                                                                href={rec.url}
                                                                download={`fusion_${rec.id}.webm`}
                                                                className="p-2 bg-white/5 hover:bg-cyan-500 rounded-lg transition-all"
                                                            >
                                                                <Download size={18} />
                                                            </a>
                                                        </div>
                                                    </GlassCard>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- NEXUS Full-Screen Editor Script -->
    <script>
/* ── NEXUS Full-Screen Editor ─────────────────────── */

// Mock dependencies for seamless integration
const state = {
  notes: JSON.parse(localStorage.getItem('nexus-notes') || '[]'),
  activeBookId: 'default',
  activeNoteId: null
};

function saveState() {
  localStorage.setItem('nexus-notes', JSON.stringify(state.notes));
}

function generateId() {
  return 'nexus-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function sanitizeHtml(html) {
  // Basic sanitization
  return html.replace(/<script[^>]*>.*?<\/script>/gi, '');
}

function activeNote() {
  return state.notes.find(n => n.id === state.activeNoteId);
}

function showToast(message) {
  // Simple toast implementation
  const toast = document.createElement('div');
  toast.textContent = message;
  toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: #06b6d4;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    z-index: 1000;
  `;
  document.body.appendChild(toast);
  setTimeout(() => document.body.removeChild(toast), 3000);
}

function renderAll() {
  // Placeholder for render functions
}

function renderSidebar() {
  // Placeholder
}

function __attachTrap(element) {
  // Placeholder for accessibility trap
}

function __detachTrap(element) {
  // Placeholder
}

function bindTextraToActive() {
  // Placeholder
}

let _nexusNoteId = null;
let _nexusSaveTimer = null;

let _eventsBound = false;
let _statsRAF = 0;

function setNexusNoteId(id) { _nexusNoteId = id; }
function getNexusNoteId() { return _nexusNoteId; }

function isNexusOpen() {
  const overlay = document.getElementById("nexus-editor-overlay");
  return !!overlay && !overlay.classList.contains("hidden");
}

function getEls() {
  return {
    overlay: document.getElementById("nexus-editor-overlay"),
    ed: document.getElementById("nexus-editor"),
    titleIn: document.getElementById("nexus-title-input"),
  };
}

function setNexusSaveBadge(s) {
  const b = document.getElementById("nexus-save-badge");
  if (!b) return;

  if (s === "saving") {
    b.textContent = "Saving\u2026";
    b.className = "nexus-pill nexus-pill-neon";
  } else {
    b.textContent = "Saved \u2713";
    b.className = "nexus-pill nexus-pill-lime";
  }
}

/** Stats (throttled via rAF) */
function nexusUpdateStatsNow() {
  const { ed } = getEls();
  if (!ed) return;

  // textContent is cheaper than innerText (innerText can trigger layout)
  const text = (ed.textContent || "").replace(/\u00A0/g, " ");
  const trimmed = text.trim();

  const words = trimmed ? trimmed.split(/\s+/).length : 0;
  const chars = text.replace(/\n/g, "").length;
  const lines = Math.max(1, text.split("\n").length);

  const wc = document.getElementById("nexus-wordcount");
  const cc = document.getElementById("nexus-charcount");
  const lc = document.getElementById("nexus-linecount");

  if (wc) wc.textContent = `${words} word${words !== 1 ? "s" : ""}`;
  if (cc) cc.textContent = `${chars} char${chars !== 1 ? "s" : ""}`;
  if (lc) lc.textContent = `${lines} line${lines !== 1 ? "s" : ""}`;
}

function nexusUpdateStats() {
  // public API remains, but internally we throttle
  if (_statsRAF) return;
  _statsRAF = requestAnimationFrame(() => {
    _statsRAF = 0;
    nexusUpdateStatsNow();
  });
}

function nexusFlushSave() {
  if (!_nexusNoteId) return;

  const note = state.notes.find(n => n.id === _nexusNoteId);
  if (!note) return;

  const { ed, titleIn } = getEls();

  if (ed) note.contentHtml = sanitizeHtml(ed.innerHTML || "<p></p>");
  if (titleIn) note.title = titleIn.value.trim() || note.title;

  note.updatedAt = Date.now();

  saveState();
  setNexusSaveBadge("saved");
}

function nexusScheduleSave() {
  setNexusSaveBadge("saving");
  clearTimeout(_nexusSaveTimer);
  _nexusSaveTimer = setTimeout(() => nexusFlushSave(), 800);
}

/** Open / Close */
function openNexusEditor() {
  const note = activeNote();
  if (!note) {
    // If no active note, create one
    nexusNewNote();
    return;
  }

  const { overlay, ed, titleIn } = getEls();
  if (!overlay || !ed || !titleIn) return;

  _nexusNoteId = note.id;

  overlay.classList.remove("hidden");

  titleIn.value = note.title || "";
  ed.innerHTML = sanitizeHtml(note.contentHtml || "<p></p>");

  nexusUpdateStatsNow();
  setNexusSaveBadge("saved");

  // focus after paint
  requestAnimationFrame(() => ed.focus());

  __attachTrap(overlay);

  // Writing assistant: if available, init and rerun after content mounts
  setTimeout(() => {
    try {
      window.nexusWAInit?.();
      window.nexusWARerun?.();
    } catch (e) {
      console.warn("WA init/rerun failed", e);
    }
  }, 120);
}

function closeNexusEditor() {
  const { overlay } = getEls();
  if (!overlay) return;

  nexusFlushSave();

  overlay.classList.add("hidden");
  __detachTrap(overlay);

  _nexusNoteId = null;
  clearTimeout(_nexusSaveTimer);

  // rebind standard editor to active note
  bindTextraToActive();
  renderAll();
}

/* ── Format commands ──────────────────────────────── */
/** execCommand is deprecated but still widely supported; keep it contained. */
function execCmd(cmd, value = null) {
  try {
    document.execCommand(cmd, false, value);
  } catch {}
  getEls().ed?.focus();
}

function nexusCmd(cmd) { execCmd(cmd); }
function nexusBlock(tag) { execCmd("formatBlock", String(tag).toUpperCase()); }
function nexusList() { execCmd("insertUnorderedList"); }
function nexusQuote() { execCmd("formatBlock", "BLOCKQUOTE"); }

function nexusCode() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;

  const range = sel.getRangeAt(0);
  const selected = range.toString();
  const code = document.createElement("code");
  code.textContent = selected || "code";

  range.deleteContents();
  range.insertNode(code);

  range.setStartAfter(code);
  range.setEndAfter(code);

  sel.removeAllRanges();
  sel.addRange(range);

  getEls().ed?.focus();
}

function nexusInsertDate() {
  execCmd("insertText", new Date().toLocaleString());
}

function nexusNewNote() {
  nexusFlushSave();

  const newNote = {
    id: generateId(),
    bookId: state.activeBookId,
    title: "",
    contentHtml: "<p></p>",
    updatedAt: Date.now(),
  };

  state.notes.unshift(newNote);
  state.activeNoteId = newNote.id;
  _nexusNoteId = newNote.id;

  saveState();
  renderSidebar();

  const { ed, titleIn } = getEls();
  if (titleIn) titleIn.value = "";
  if (ed) {
    ed.innerHTML = "<p></p>";
    ed.focus();
  }

  nexusUpdateStatsNow();
  setNexusSaveBadge("saved");
  showToast("New note created");
}

/* ── Wire up editor events (called once from main.js) ── */
function initNexusEditorEvents() {
  if (_eventsBound) return;
  _eventsBound = true;

  const { ed, titleIn } = getEls();

  if (ed) {
    ed.addEventListener("input", () => {
      if (!isNexusOpen()) return;
      nexusScheduleSave();
      nexusUpdateStats();
    });

    ed.addEventListener("keydown", (e) => {
      if (!isNexusOpen()) return;

      const mod = e.ctrlKey || e.metaKey;
      const key = (e.key || "").toLowerCase();

      if (e.key === "Escape") {
        e.preventDefault();
        closeNexusEditor();
        return;
      }

      if (mod && key === "s") {
        e.preventDefault();
        nexusFlushSave();
        window.saveSnapshot?.();
        showToast("Snapshot saved \u2713");
        return;
      }

      if (mod && key === "n") {
        e.preventDefault();
        nexusNewNote();
        return;
      }

      if (mod && key === "b") { e.preventDefault(); nexusCmd("bold"); return; }
      if (mod && key === "i") { e.preventDefault(); nexusCmd("italic"); return; }
      if (mod && key === "u") { e.preventDefault(); nexusCmd("underline"); return; }
    });
  }

  if (titleIn) {
    titleIn.addEventListener("input", () => {
      if (!isNexusOpen()) return;
      nexusScheduleSave();
    });
  }

  // Global Ctrl/Cmd+E toggle (bound once)
  window.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const key = (e.key || "").toLowerCase();
    if (!mod || key !== "e") return;

    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;

    e.preventDefault();
    if (isNexusOpen()) closeNexusEditor();
    else openNexusEditor();
  });
}

// Initialize NEXUS events when DOM is ready
document.addEventListener("DOMContentLoaded", initNexusEditorEvents);

// Expose functions globally for onclick handlers
window.openNexusEditor = openNexusEditor;
window.closeNexusEditor = closeNexusEditor;
window.nexusCmd = nexusCmd;
window.nexusBlock = nexusBlock;
window.nexusList = nexusList;
window.nexusQuote = nexusQuote;
window.nexusCode = nexusCode;
window.nexusInsertDate = nexusInsertDate;
window.nexusNewNote = nexusNewNote;
    </script>
