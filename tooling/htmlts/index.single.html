<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n    <title>Single-File HTML+TS Demo</title>\n    <style>\n      * { margin: 0; padding: 0; box-sizing: border-box; }\n      body {\n        font-family: system-ui, sans-serif;\n        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n        min-height: 100vh;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        padding: 1rem;\n      }\n      #app {\n        background: white;\n        border-radius: 12px;\n        box-shadow: 0 20px 60px rgba(0,0,0,0.3);\n        padding: 2rem;\n        max-width: 800px;\n        width: 100%;\n      }\n      h1 { margin-bottom: 1rem; color: #333; }\n      p { margin: 0.5rem 0; color: #666; }\n      pre {\n        background: #f5f5f5;\n        padding: 1rem;\n        border-radius: 4px;\n        border-left: 4px solid #667eea;\n        overflow-x: auto;\n        margin-top: 1rem;\n        font-size: 12px;\n      }\n      button {\n        background: #667eea;\n        color: white;\n        border: none;\n        padding: 0.5rem 1rem;\n        border-radius: 4px;\n        cursor: pointer;\n        margin-top: 1rem;\n      }\n      button:hover { background: #764ba2; }\n    </style>\n  </head>\n  <body>\n    <div id=\"app\"></div>\n\n    <!-- Embedded TypeScript (compiled by @we/htmlts-compiler) -->\n    <script type=\"text/ts\">\n      /**\n       * Single-File HTML+TS Demo\n       *\n       * This TypeScript runs in <script type=\"text/ts\">\n       * and is compiled to JavaScript by the htmlts compiler.\n       */\n\n      const app = document.getElementById(\"app\");\n      if (!app) throw new Error(\"Missing #app\");\n\n      // TypeScript with full language features\n      interface Log {\n        lines: string[];\n        add(msg: string): void;\n        render(): void;\n      }\n\n      const logs: Log = {\n        lines: [],\n        add(msg) {\n          this.lines.push(msg);\n          this.render();\n        },\n        render() {\n          const pre = document.getElementById(\"log\");\n          if (pre) pre.textContent = this.lines.join(\"\\n\");\n        },\n      };\n\n      // Render UI\n      app.innerHTML = `\n        <h1>🎯 Single-File HTML+TS Compiler</h1>\n        <p><strong>Status:</strong> ✅ Online</p>\n        <p><strong>Runtime:</strong> Browser ES2022</p>\n        <p><strong>Language:</strong> TypeScript (compiled to JS)</p>\n        <button id=\"test-btn\">Run Demo</button>\n        <pre id=\"log\">Waiting for user action...</pre>\n      `;\n\n      // Test functions (full TypeScript support)\n      function add(a: number, b: number): number {\n        return a + b;\n      }\n\n      function greet(name: string): string {\n        return `Hello, ${name}!`;\n      }\n\n      interface Point {\n        x: number;\n        y: number;\n      }\n\n      function distance(p1: Point, p2: Point): number {\n        const dx = p2.x - p1.x;\n        const dy = p2.y - p1.y;\n        return Math.sqrt(dx * dx + dy * dy);\n      }\n\n      // Wire button\n      document.getElementById(\"test-btn\")?.addEventListener(\"click\", () => {\n        logs.lines = []; // clear\n\n        logs.add(\"📋 Running TypeScript demo...\");\n        logs.add(\"\");\n\n        // Basic math\n        const sum = add(5, 3);\n        logs.add(`✓ add(5, 3) = ${sum}`);\n\n        // String interpolation\n        const greeting = greet(\"World\");\n        logs.add(`✓ greet(\\\"World\\\") = ${greeting}`);\n\n        // Geometry (interfaces)\n        const p1: Point = { x: 0, y: 0 };\n        const p2: Point = { x: 3, y: 4 };\n        const dist = distance(p1, p2);\n        logs.add(`✓ distance({0,0}, {3,4}) = ${dist}`);\n\n        // Array operations (generics)\n        const nums: number[] = [1, 2, 3, 4, 5];\n        const doubled = nums.map((n) => n * 2);\n        logs.add(`✓ [1,2,3,4,5].map(*2) = ${doubled}`);\n\n        logs.add(\"\");\n        logs.add(\"✅ All TypeScript features working!\");\n      });\n\n      // Auto-run on page load\n      logs.add(\"✓ Page loaded\");\n      logs.add(\"✓ HTML compiled from <script type='text/ts'>\");\n      logs.add(\"✓ TypeScript available in browser\");\n      logs.add(\"\");\n      logs.add(\"💡 Click 'Run Demo' to test TypeScript features\");\n    </script>\n  </body>\n</html>\n
